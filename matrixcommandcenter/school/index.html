/* Paste-back: accepts either one pack object or an array of them. */
function PackImport({db, setDb}){
  const [raw,setRaw] = useState('');
  const [msg,setMsg] = useState('');
  const load = () => {
    setMsg('');
    try{
      let t = raw.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
      const a = t.indexOf('['), o = t.indexOf('{');
      const start = (a>-1 && (a<o || o===-1)) ? a : o;
      const endCh = (start===a) ? ']' : '}';
      const end = t.lastIndexOf(endCh);
      if(start>-1 && end>start) t = t.slice(start, end+1);
      let arr = JSON.parse(t);
      if(!Array.isArray(arr)) arr = [arr];
      const known = new Set(db.courses.map(c=>c.id));
      const clean = arr.filter(p=>p && p.title).map((p,i)=>({
        ...p,
        id: String(p.id || ('pack-'+Date.now()+'-'+i)),
        courseId: known.has(p.courseId) ? p.courseId : db.courses[0].id,
        cards: p.cards||[], quiz: p.quiz||[], test: p.test||[],
        match: p.match||[], scenarios: p.scenarios||[], guide: p.guide||[],
      }));
      if(!clean.length) throw new Error('no pack in there had a title');
      /* A pack whose "answer" is not one of its "choices" can never be scored. */
      let fixed = 0;
      for(const p of clean){
        for(const list of [p.quiz, p.test]){
          for(const q of list){
            if(q.choices && q.answer && !q.choices.includes(q.answer)){ q.choices = [...q.choices, q.answer]; fixed++; }
          }
        }
      }
      setDb(d=>{
        const have = new Set((d.packs||[]).map(p=>p.id));
        return {...d, packs:[...(d.packs||[]).filter(p=>!clean.some(c=>c.id===p.id)),
                             ...clean.filter(p=>true)]};
      });
      const c0 = clean[0];
      setMsg('Loaded "' + c0.title + '" — ' + (c0.cards||[]).length + ' cards, '
        + (c0.quiz||[]).length + ' quiz, ' + (c0.test||[]).length + ' test, '
        + (c0.scenarios||[]).length + ' scenarios.'
        + (fixed ? ' Repaired ' + fixed + ' question(s) whose answer was missing from its choices.' : ''));
      setRaw('');
    }catch(e){ setMsg('Could not read that: ' + e.message); }
  };
  return (
    <div>
      <textarea rows={5} value={raw} onChange={e=>setRaw(e.target.value)}
        placeholder='Paste the JSON pack Claude gave you...' style={{fontSize:12}} className="mono"/>
      <div style={{display:'flex', gap:9, marginTop:10, flexWrap:'wrap', alignItems:'center'}}>
        <Btn onClick={load} disabled={!raw.trim()}>Load pack</Btn>
        {(db.packs||[]).length>0 && <Btn ghost tone={T.bad} onClick={()=>{
          if(window.confirm && !window.confirm('Delete every study pack and its scores?')) return;
          setDb(d=>({...d, packs:[], results:{}}));
          setMsg('Cleared.');
        }}>Clear all packs</Btn>}
        <span style={{fontSize:12, color:T.dim}}>{(db.packs||[]).length} in library</span>
      </div>
      {msg && <div style={{fontSize:12.5, color:T.accent2, marginTop:10, lineHeight:1.6}}>{msg}</div>}
    </div>
  );
}

  const units = useMemo(()=> targetCourse ? courseUnits(db, targetCourse) : [], [target, db.materials, db.events]);

  /* Default to the unit whose exam is next — that is almost always what he is
     uploading for, and it saves a click on the common path. */
  useEffect(()=>{
    if(!targetCourse){ setPickUnit(''); return; }
    const a = activeUnit(db, targetCourse);
    setPickUnit(a ? a.label : '');
  },[target]);

  const unitValue = pickUnit === '__new__' ? newUnit.trim() : pickUnit;

  const ingest = async (files) => {
    setErr('');

      setBusy(f.name);

/* Materials grouped course → unit, in the order the semester actually runs.
   A flat pile stops being usable around the fifth upload. */
function MaterialGroups({db, mats, go}){
  const groups = useMemo(()=>{
    const byCourse = new Map();
    for(const m of mats){
      if(!byCourse.has(m.courseId)) byCourse.set(m.courseId, new Map());
      const key = m.unit || 'Unfiled';
      const u = byCourse.get(m.courseId);
      if(!u.has(key)) u.set(key, []);
      u.get(key).push(m);
    }
    const out = [];
    for(const [cid, unitMap] of byCourse){
      const course = db.courses.find(c=>c.id===cid);
      if(!course) continue;
      const order = new Map(courseUnits(db, course).map((u,i)=>[u.label, i]));
      const units = [...unitMap.entries()]
        .map(([label, items])=>({ label, items,
          i: order.has(label) ? order.get(label) : 998,
          /* Surface the unit being examined next, wherever it sits in order. */
          active: (activeUnit(db, course)||{}).label === label }))
        .sort((a,b)=>a.i-b.i);
      out.push({ course, units });
    }
    return out.sort((a,b)=>{
      const ea = activeUnit(db,a.course), eb = activeUnit(db,b.course);
      const da = ea && ea.date ? daysUntil(ea.date) : 9999;
      const dbb = eb && eb.date ? daysUntil(eb.date) : 9999;
      return da - dbb;
    });
  },[mats, db.events, db.courses]);

  return (
    <div style={{display:'grid', gap:22}}>
      {groups.map(g=>(
        <div key={g.course.id}>
          <div style={{display:'flex', alignItems:'center', gap:9, marginBottom:11}}>
            <div style={{width:3, height:18, background:g.course.color, borderRadius:2}}/>
            <div style={{fontSize:13, fontWeight:800, color:g.course.color}}>{g.course.code}</div>
            <div style={{fontSize:11.5, color:T.dimmer}}>{g.course.name}</div>
          </div>
          <div style={{display:'grid', gap:14}}>
            {g.units.map(u=>(
              <div key={u.label}>
                <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:8,
                  paddingLeft:2}}>
                  <span style={{fontSize:11.5, fontWeight:800, letterSpacing:.7,
                    textTransform:'uppercase', color: u.active ? T.accent2 : T.dim}}>{u.label}</span>
                  {u.active && <Pill tone={T.accent2}>studying now</Pill>}
                  <span style={{fontSize:11, color:T.dimmer}}>
                    {u.items.length} file{u.items.length===1?'':'s'}
                  </span>
                </div>
                <div style={{display:'grid', gap:9, paddingLeft:12,
                  borderLeft:'1px solid '+(u.active ? T.accent2+'44' : T.line)}}>
                  {u.items.map(m=>(
                    <Card key={m.id} style={{cursor:'pointer', padding:13}}
                      onClick={()=>go({view:'material', materialId:m.id})}>
                      <div style={{display:'flex', justifyContent:'space-between', gap:14, alignItems:'flex-start'}}>
                        <div style={{minWidth:0, flex:1}}>
                          <div style={{fontSize:13.5, fontWeight:650}} className="clamp2">{m.name}</div>
                          <div style={{fontSize:11.5, color:T.dim, marginTop:5, display:'flex', gap:9, flexWrap:'wrap'}}>
                            <span>{m.pack.stats.slides ? m.pack.stats.slides+' slides' : m.pack.stats.words+' words'}</span>
                            <span>{db.cards.filter(x=>x.materialId===m.id).length} cards</span>
                            <span>{new Date(m.addedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
                          </div>
                        </div>
                        <div style={{display:'flex', flexDirection:'column', gap:5, alignItems:'flex-end'}}>
                          {m.role==='guide' && <Pill tone={T.bad}>Study guide</Pill>}
                          <Pill tone={T.dimmer}>{kindMeta(m.role).label}</Pill>
                        </div>
                      </div>
                    </Card>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   REVIEW — active recall, Leitner boxes
   ============================================================ */
function ReviewView({db, setDb, filter, go}){
  const pool = useMemo(()=>{
    let cs = db.cards;
    if(filter.courseId)   cs = cs.filter(c=>c.courseId===filter.courseId);
    if(filter.materialId) cs = cs.filter(c=>c.materialId===filter.materialId);
    const dueOnes = cs.filter(cardDue);
    const use = dueOnes.length ? dueOnes : cs;
    return use.slice().sort(()=>Math.random()-0.5).slice(0,40);
  }, [filter.courseId, filter.materialId]);

  const [i,setI] = useState(0);
  const [show,setShow] = useState(false);
  const [tally,setTally] = useState({right:0, wrong:0});
  const card = pool[i];

  const answer = (correct) => {
    setDb(d=>({...d, cards:d.cards.map(c=>c.id===card.id?gradeCard(c,correct):c)}));
    setTally(t=>({right:t.right+(correct?1:0), wrong:t.wrong+(correct?0:1)}));
    setShow(false); setI(x=>x+1);
  };
  useEffect(()=>{
    const k = e => {
      if(!card) return;
      if(e.code==='Space'){ e.preventDefault(); setShow(s=>!s); }
      if(show && (e.key==='1'||e.key==='ArrowLeft'))  answer(false);
      if(show && (e.key==='2'||e.key==='ArrowRight')) answer(true);
    };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k);
  },[card,show]);

  if(!pool.length) return (
    <div className="fade-in"><H>Review</H>
      <Card><Empty icon="◆" title="No cards to review"
        sub="Upload a deck in the Study Lab and cards build themselves."/></Card></div>
  );
  if(!card) return (
    <div className="fade-in"><H>Session done</H>
      <Card style={{textAlign:'center', padding:'40px 20px'}}>
        <div style={{fontSize:46, fontWeight:900, color:T.good}}>{tally.right}/{tally.right+tally.wrong}</div>
        <div style={{color:T.dim, fontSize:13.5, marginTop:8, lineHeight:1.6}}>
          Missed cards come back tomorrow. The ones you got right move out to 3, 7, then 21 days.
        </div>
        <div style={{marginTop:18, display:'flex', gap:9, justifyContent:'center', flexWrap:'wrap'}}>
          <Btn onClick={()=>{setI(0); setTally({right:0,wrong:0});}}>Go again</Btn>
          <Btn ghost tone={T.line} onClick={()=>go({view:'today'})}>Back to Today</Btn>
        </div>
      </Card></div>
  );

  return (
    <div className="fade-in">
      <H sub={(i+1)+' of '+pool.length+'  ·  space to flip, then 1 = missed / 2 = got it'}>Review</H>
      <div style={{height:3, background:T.line, borderRadius:2, marginBottom:20, overflow:'hidden'}}>
        <div style={{height:'100%', width:((i/pool.length)*100)+'%', background:T.accent, transition:'width .25s'}}/>
      </div>
      <Card style={{minHeight:250, display:'flex', flexDirection:'column', justifyContent:'center',
        padding:'34px 26px', cursor:'pointer'}} onClick={()=>setShow(s=>!s)}>
        <div style={{textAlign:'center'}}>
          <Pill tone={T.dimmer}>{card.kind}</Pill>
          <div style={{fontSize:19, fontWeight:650, marginTop:16, lineHeight:1.55}}>{card.front}</div>
          {show && <div className="scale-in" style={{marginTop:22, paddingTop:20, borderTop:'1px solid '+T.line,
            fontSize:15.5, color:T.accent2, lineHeight:1.6}}>{card.back}</div>}
          {!show && <div style={{marginTop:22, fontSize:12, color:T.dimmer}}>click or press space to reveal</div>}
        </div>
      </Card>
      {show && (
        <div style={{display:'flex', gap:10, marginTop:14, justifyContent:'center'}}>
          <Btn tone={T.bad} onClick={()=>answer(false)} style={{minWidth:150}}>Missed it</Btn>
          <Btn tone={T.good} onClick={()=>answer(true)} style={{minWidth:150}}>Got it</Btn>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   SCHEDULE — an actual week, not a wall of deadlines
   ============================================================ */
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* Allocate study blocks over the next 7 days. Rules that come from how
   Habib actually operates: Saturdays are Matrix jobs, two blocks a day
   is the ceiling, and the thing due soonest gets the earlier block. */
function buildWeek(db){
  const items = triage(db, 21);
  const exams = upcomingExams(db);
  const days = [];
  for(let k=0;k<7;k++){
    const date = new Date(startOfDay(new Date()).getTime() + k*DAY);
    const dow = date.getDay();
    const busy = (db.schedule.busy||[]).filter(b=>b.days.includes(dow));
    const capacity = dow===SAT ? 0 : dow===0 ? 2 : 2;
    days.push({date, dow, busy, capacity, blocks:[], due:[]});
  }
  /* Deadlines land on their own day so he sees the wall coming. */
  for(const it of items){
    const k = it.days;
    if(k>=0 && k<7) days[k].due.push(it);
  }
  /* Exam prep sessions are placed first — they are the non-negotiable ones.
     MKT posts four chapter tests on one date; that is one study track, not
     four, so collapse exams sharing a course and a day before planning. */
  const tracks = [];
  for(const ex of exams){
    const key = (ex.course?ex.course.id:'?') + '|' + ex.at.slice(0,8);
    const hit = tracks.find(t=>t.key===key);
    if(hit){ hit.titles.push(ex.title); continue; }
    tracks.push({key, ex, titles:[ex.title]});
  }
  for(const tr of tracks.slice(0,3)){
    const ex = tr.ex;
    const label = tr.titles.length>1 ? tr.titles.length+' tests' : ex.title;
    for(const p of prepPlan(ex, db)){
      const k = Math.round((startOfDay(p.date) - startOfDay(new Date()))/DAY);
      if(k<0 || k>6) continue;
      const d = days[k];
      const title = (ex.course?ex.course.code:'Exam')+' — '+p.label;
      if(d.blocks.length >= d.capacity || d.blocks.some(b=>b.title===title)) continue;
      d.blocks.push({ kind:'exam', minutes:p.minutes, title,
        detail:p.what+' ('+label+')', color: ex.course?ex.course.color:T.bad });
    }
  }
  /* Then fill leftover capacity with the highest-scoring work, scheduled
     one to two days ahead of its deadline rather than on the due date. */
  for(const it of items){
    if(it.type==='exam') continue;
    const target = clamp(it.days - 1, 0, 6);
    for(let k=target;k<7;k++){
      const d = days[k];
      if(d.blocks.length >= d.capacity) continue;
      if(d.blocks.some(b=>b.ref===it.ev.uid)) break;
      d.blocks.push({ kind:'work', ref:it.ev.uid, minutes:45,
        title:(it.course?it.course.code:'')+' — '+it.ev.title,
        detail:'Due '+fmtDate(it.date)+'. '+TYPE_META[it.type].label+'.',
        color: it.course?it.course.color:T.dim });
      break;
    }
  }
  return days;
}

/* ============================================================
   SETTINGS — sync, feed refresh, backup
   ============================================================ */
function SettingsView({db, setDb, fs}){
  const [icsBusy,setIcsBusy] = useState(false);
  const [msg,setMsg] = useState('');
  const fileRef = useRef(null);
  const icsRef  = useRef(null);

  const loadICSFile = async (f) => {
    setIcsBusy(true); setMsg('');
    try{
      const text = await f.text();
      const evs = parseICS(text).filter(e => courseFor(e.course, db.courses));
      if(!evs.length) throw new Error('No events matched your Fall 2026 courses.');
      setDb(d=>({...d, events:evs, settings:{...d.settings, lastSync:new Date().toISOString()}}));
      setMsg('Loaded '+evs.length+' events from '+f.name+'.');
    }catch(e){ setMsg('Failed: '+e.message); }
    setIcsBusy(false);
  };
  const tryUrlSync = async () => {
    const url = db.settings.icsUrl.trim();
    if(!url){ setMsg('Paste your feed URL first.'); return; }
    setIcsBusy(true); setMsg('');
    /* Brightspace sends no CORS header, so a direct fetch from this page is
       refused. Two proxies do the job: serve.ps1 at /api/ics when running
       locally, and a Netlify function when hosted. */
    const local = /^https?:\/\/localhost(:\d+)?$/.test(location.origin);
    const q = '?url=' + encodeURIComponent(url);
    const targets = local
      ? [location.origin+'/api/ics'+q, location.origin+'/.netlify/functions/ics'+q, url]
      : [location.origin+'/.netlify/functions/ics'+q, url];
    let lastErr = '';
    for(const t of targets){
      try{
        const r = await fetch(t);
        if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
        const evs = parseICS(await r.text()).filter(e => courseFor(e.course, db.courses));
        if(!evs.length) throw new Error('feed returned nothing matching your Fall 2026 courses');
        setDb(d=>({...d, events:evs, settings:{...d.settings, lastSync:new Date().toISOString()}}));
        setMsg('Synced '+evs.length+' events from Brightspace.');
        setIcsBusy(false); return;
      }catch(e){ lastErr = e.message; }
    }
    setMsg('Sync failed: '+lastErr+' — if that keeps happening, hit Download in the same Brightspace'
      + ' Subscribe dialog and drop the .ics file below. That path always works.');
    setIcsBusy(false);
  };
  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ultramind-school-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  const importJSON = async (f) => {
    try{
      const d = JSON.parse(await f.text());
      if(!d.v) throw new Error('not an Ultramind backup');
      setDb(d); setMsg('Restored backup.');
    }catch(e){ setMsg('Import failed: '+e.message); }
  };

  const Row = ({title, children, sub}) => (
    <Card style={{marginBottom:13}}>
      <div style={{fontSize:14, fontWeight:700, marginBottom:sub?4:10}}>{title}</div>
      {sub && <div style={{fontSize:12, color:T.dim, marginBottom:11, lineHeight:1.6}}>{sub}</div>}
      {children}
    </Card>
  );

  return (
    <div className="fade-in">
      <H sub="Sync, backup, and how this thing gets your Brightspace data">Settings</H>

      <Row title="Load daily lessons from Claude"
        sub="On the Daily lesson tab, hit “Ask Claude for more days”. Paste the JSON array back here. These are the short one-idea-a-day lessons, separate from the drill packs below.">
        <DailyImport db={db} setDb={setDb}/>
      </Row>

      <Row title="Load a study pack from Claude"
        sub="On the Study tab, hit “Ask Claude to build a pack” — it copies your uploaded material, your unit and your exam date. Paste that into Claude, then paste the JSON it returns back here. One pack gives you the guide, flashcards, quiz, exam simulator, matching game and scenarios.">
        <PackImport db={db} setDb={setDb}/>
      </Row>

      <Row title="Cloud sync"
        sub="Saves to the same Supabase project the Command Center and Matrix Ledger use, in a row called 'school'. Any device that opens this page picks up the newest copy — no folder setup, no export files. Newest write wins, so do not edit the same thing on two machines at once.">
        <div style={{display:'flex', gap:12, alignItems:'center', flexWrap:'wrap'}}>
          <SyncDot state={fs.cloud.state}/>
          <Btn ghost tone={T.line} onClick={fs.cloud.pull}>Pull now</Btn>
          <Btn ghost tone={T.line} onClick={fs.cloud.push}>Push now</Btn>
        </div>
        {fs.cloud.state.err && <div style={{fontSize:11.5, color:T.bad, marginTop:10, lineHeight:1.6}}>
          {fs.cloud.state.err}
        </div>}
        <div style={{fontSize:11.5, color:T.dimmer, marginTop:10, lineHeight:1.6}}>
          Your Brightspace feed token is deliberately excluded from the cloud row — the
          publishable key sits in this file, so anything stored there is readable by anyone
          holding it. Paste the feed URL once per machine.
        </div>
      </Row>

      <Row title="OneDrive backup"
        sub={FS_SUPPORTED
          ? 'Optional second copy. Cloud sync above already covers the laptop; this writes school-data.json into the OneDrive folder as well, so your work survives the database being unreachable. Once per machine.'
          : 'This browser does not support folder writes. Cloud sync above still works; Export / Import below is the manual fallback.'}>
        <div style={{display:'flex', gap:9, alignItems:'center', flexWrap:'wrap'}}>
          {FS_SUPPORTED && <Btn onClick={fs.connect}>{fs.dir ? 'Reconnect folder' : 'Connect OneDrive folder'}</Btn>}
          <span style={{fontSize:12.5, color: fs.dir?T.good:T.dim}}>
            {fs.dir ? 'Connected · last write '+(fs.lastWrite||'—') : 'Not connected — saving to this device only'}
          </span>
        </div>
        {!window.isSecureContext && <div style={{fontSize:11.5, color:T.warn, marginTop:10, lineHeight:1.6}}>
          Folder sync needs an http origin. Open this from http://localhost:8777/school/ (run serve.ps1), not by double-clicking the file.
        </div>}
      </Row>

      <Row title="Brightspace calendar feed"
        sub="Brightspace publishes every due date as an iCal feed. In Brightspace: Calendar → Subscribe → copy the URL, or hit Download and drop the .ics file here.">
        <input placeholder="https://brightspace.missouristate.edu/d2l/le/calendar/feed/user/feed.ics?token=…"
          value={db.settings.icsUrl}
          onChange={e=>setDb(d=>({...d, settings:{...d.settings, icsUrl:e.target.value}}))}
          style={{fontSize:12, marginBottom:10}} className="mono"/>
        <div style={{display:'flex', gap:9, flexWrap:'wrap'}}>
          <Btn onClick={tryUrlSync} disabled={icsBusy}>{icsBusy?'Working…':'Try URL sync'}</Btn>
          <Btn ghost tone={T.line} onClick={()=>icsRef.current&&icsRef.current.click()}>Drop .ics file</Btn>
          <input ref={icsRef} type="file" accept=".ics" hidden
            onChange={e=>{ if(e.target.files[0]) loadICSFile(e.target.files[0]); e.target.value=''; }}/>
        </div>
        <div style={{fontSize:11.5, color:T.dim, marginTop:10}}>
          {db.events.length} events loaded
          {db.settings.lastSync ? ' · last sync '+new Date(db.settings.lastSync).toLocaleString() :
            ' · seeded from your feed on '+(window.SEED_BUILT||'setup')}
        </div>
      </Row>

      <Row title="Backup" sub="A full copy of everything: work status, uploaded material, notes, and card progress.">
        <div style={{display:'flex', gap:9, flexWrap:'wrap'}}>
          <Btn ghost tone={T.line} onClick={exportJSON}>Export JSON</Btn>
          <Btn ghost tone={T.line} onClick={()=>fileRef.current&&fileRef.current.click()}>Import JSON</Btn>
          <input ref={fileRef} type="file" accept=".json" hidden
            onChange={e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; }}/>
        </div>
      </Row>

      <Row title="Reset" sub="Wipes local data and reloads the seeded Brightspace events. Uploaded material and card progress are lost.">
        <Btn ghost tone={T.bad} onClick={()=>{
          if(window.confirm && !window.confirm('Wipe everything and start over?')) return;
          localStorage.removeItem(LS_KEY); setDb(blankDB());
        }}>Reset everything</Btn>
      </Row>

      {msg && <Card style={{borderColor:T.accent2+'55', background:T.accent2+'0a'}}>
        <div style={{fontSize:12.5, lineHeight:1.65, color:T.text}}>{msg}</div></Card>}
    </div>
  );
}

/* ============================================================
   APP SHELL
   ============================================================ */
function App(){
  const [db,setDbRaw] = useState(()=>{
    const d = loadLocal() || blankDB();
    /* Idempotent: titles saved before the cleaner existed get tidied on open. */
    return {...d, events: normalizeEvents(d.events)};
  });
  const [nav,setNav]  = useState({view:'today'});
  const [fs,setFs]    = useState({dir:null, lastWrite:null});
  const [saved,setSaved] = useState(false);
  const [mobileOpen,setMobileOpen] = useState(false);
  const dirRef = useRef(null);

  const setDb = useCallback(updater => {
    setDbRaw(prev => {
      const next = typeof updater==='function' ? updater(prev) : updater;
      return {...next, updatedAt:new Date().toISOString()};
    });
  },[]);

  /* Persist locally on every change, debounced so typing does not thrash. */
  useEffect(()=>{
    const t = setTimeout(()=>{
      saveLocal(db);
      setSaved(true); setTimeout(()=>setSaved(false), 1200);
      if(dirRef.current){
        fsWrite(dirRef.current, db)
          .then(()=>setFs(f=>({...f, lastWrite:new Date().toLocaleTimeString()})))
          .catch(()=>{});
      }
    }, 500);
    return ()=>clearTimeout(t);
  },[db]);

  /* Cloud is the primary sync layer; OneDrive is the offline backup. Both
     resolve against the same updatedAt stamp, so whichever copy is newest wins
     regardless of which layer it arrived through. */
  const applyRemote = useCallback(next => setDbRaw(next), []);
  /* Captured once, before the first save writes a localStorage entry. */
  const freshDevice = useRef(loadLocal() === null);
  const cloud = useCloudSync(db, applyRemote, freshDevice.current);

  /* On open, adopt the OneDrive copy when it is newer than this device's. */
  useEffect(()=>{ (async()=>{
    if(!FS_SUPPORTED) return;
    const h = await fsGetFolder();
    if(!h || h.needsPermission) return;
    dirRef.current = h; setFs(f=>({...f, dir:h}));
    const remote = await fsRead(h);
    if(remote && remote.v && (!db.updatedAt || new Date(remote.updatedAt) > new Date(db.updatedAt))){
      setDbRaw(remote);
    }
  })(); },[]);

  const connectFolder = async () => {
    try{
      const h = await fsPickFolder();
      dirRef.current = h; setFs(f=>({...f, dir:h}));
      const remote = await fsRead(h);
      if(remote && remote.v && window.confirm &&
         window.confirm('Found existing school-data.json in that folder. Load it? (Cancel keeps what is on this device.)')){
        setDbRaw(remote);
      } else {
        await fsWrite(h, db);
        setFs(f=>({...f, lastWrite:new Date().toLocaleTimeString()}));
      }
    }catch(e){ /* user dismissed the picker */ }
  };

  const go = useCallback(n => { setNav(n); setMobileOpen(false); window.scrollTo && window.scrollTo(0,0); },[]);

  const items = triage(db, 14);
  const urgent = items.filter(i=>i.days<=1).length;
  const dueCards = db.cards.filter(cardDue).length;
  const nextExam = upcomingExams(db)[0];

  const packCount = (db.packs||[]).length;
  const dailyLeft = (db.daily||[]).filter(l=>!(db.dailyLog||{})[l.id]).length;
  const NAV = [
    {k:'today', label:'Today', icon:'◉', badge:urgent||null, tone:T.bad},
    {k:'daily', label:'Daily lesson', icon:'✦', badge:dailyLeft||null, tone:T.good},
    {k:'teach', label:'Study & drill', icon:'◈', badge:packCount||null, tone:T.accent2},
    {k:'schedule', label:'Schedule', icon:'▦'},
    {k:'exams', label:'Exams', icon:'⚑', badge:nextExam?Math.max(0,daysUntil(nextExam.date)):null, tone:T.warn},
    {k:'lab', label:'Study Lab', icon:'▤', badge:db.materials.length||null},
    {k:'review', label:'Review', icon:'◆', badge:dueCards||null, tone:T.accent2},
  ];

  const body = (()=>{
    if(nav.view==='today')    return <TodayView db={db} setDb={setDb} go={go}/>;
    if(nav.view==='daily')    return <DailyView db={db} setDb={setDb} go={go}/>;
    if(nav.view==='teach')    return <TeachView db={db} setDb={setDb} go={go}/>;
    if(nav.view==='schedule') return <ScheduleView db={db} setDb={setDb}/>;
    if(nav.view==='exams')    return <ExamsView db={db}/>;
    if(nav.view==='lab')      return (
      <div className="fade-in">
        <H sub="Drop a deck. Get an outline, key terms, flashcards, and the fastest way to study that specific file.">Study Lab</H>
        <MaterialList db={db} setDb={setDb} courseId={null} go={go}/>
      </div>);
    if(nav.view==='material') return <MaterialView db={db} setDb={setDb} materialId={nav.materialId} go={go}/>;
    if(nav.view==='review')   return <ReviewView db={db} setDb={setDb} filter={nav} go={go}/>;
    if(nav.view==='settings') return <SettingsView db={db} setDb={setDb} fs={{...fs, connect:connectFolder, cloud}}/>;
    if(nav.view==='course'){
      const c = db.courses.find(x=>x.id===nav.courseId);
      return c ? <CourseView db={db} setDb={setDb} course={c} go={go}/> : <Empty icon="?" title="Course not found"/>;
    }
    return null;
  })();

  const NavBtn = ({active, onClick, children, badge, tone, icon}) => (
    <button onClick={onClick} style={{
      display:'flex', alignItems:'center', gap:10, width:'100%', textAlign:'left',
      padding:'9px 11px', borderRadius:10, fontSize:13, fontWeight:600,
      background: active ? 'rgba(232,90,120,.14)' : 'transparent',
      color: active ? T.text : T.dim,
      borderLeft:'2px solid '+(active?T.accent:'transparent'), transition:'all .12s'}}>
      <span style={{width:15, textAlign:'center', opacity:active?1:.6, fontSize:12}}>{icon}</span>
      <span style={{flex:1, minWidth:0, overflow:'hidden', textOverflow:'ellipsis'}}>{children}</span>
      {badge ? <span style={{fontSize:10, fontWeight:800, padding:'2px 6px', borderRadius:999,
        background:(tone||T.dimmer)+'26', color:tone||T.dim}}>{badge}</span> : null}
    </button>
  );

  return (
    <React.Fragment>
      <aside style={{
        width:236, flexShrink:0, background:T.panel, borderRight:'1px solid '+T.line,
        display:'flex', flexDirection:'column', padding:'18px 12px', overflowY:'auto',
        position: window.innerWidth<860 ? 'fixed' : 'relative',
        left: window.innerWidth<860 ? (mobileOpen?0:-260) : 0,
        top:0, bottom:0, zIndex:50, transition:'left .2s'}}>
        <div style={{padding:'0 8px 16px'}}>
          <div style={{fontSize:15.5, fontWeight:900, letterSpacing:-.3}}>
            <span style={{color:T.accent}}>ULTRA</span>MIND
          </div>
          <div style={{fontSize:10.5, color:T.dimmer, letterSpacing:1.2, textTransform:'uppercase', marginTop:3}}>
            Fall 2026 · Missouri State
          </div>
        </div>

        <div style={{display:'grid', gap:2, marginBottom:16}}>
          {NAV.map(n=>(
            <NavBtn key={n.k} active={nav.view===n.k} onClick={()=>go({view:n.k})}
              badge={n.badge} tone={n.tone} icon={n.icon}>{n.label}</NavBtn>
          ))}
        </div>

        <div style={{padding:'0 11px 8px', fontSize:10, letterSpacing:1.1, textTransform:'uppercase',
          color:T.dimmer, fontWeight:700}}>Classes</div>
        <div style={{display:'grid', gap:2, marginBottom:16}}>
          {db.courses.map(c=>{
            const soon = db.events.filter(e=>isWork(e) && !db.done[e.uid] &&
              courseFor(e.course,db.courses)===c && daysUntil(icsToDate(e.at))>=0 && daysUntil(icsToDate(e.at))<=7).length;
            const active = nav.view==='course' && nav.courseId===c.id;
            return (
              <button key={c.id} onClick={()=>go({view:'course', courseId:c.id})} style={{
                display:'flex', alignItems:'center', gap:9, width:'100%', textAlign:'left',
                padding:'8px 11px', borderRadius:10, fontSize:12.5, fontWeight:600,
                background: active ? c.color+'1c' : 'transparent', color: active ? T.text : T.dim,
                borderLeft:'2px solid '+(active?c.color:'transparent')}}>
                <span style={{width:6, height:6, borderRadius:2, background:c.color, flexShrink:0}}/>
                <span style={{flex:1, minWidth:0, overflow:'hidden', textOverflow:'ellipsis'}}>{c.code}</span>
                {soon>0 && <span style={{fontSize:10, fontWeight:800, color:soon>3?T.bad:T.dim}}>{soon}</span>}
              </button>
            );
          })}
        </div>

        <div style={{marginTop:'auto', paddingTop:14, borderTop:'1px solid '+T.line}}>
          <NavBtn active={nav.view==='settings'} onClick={()=>go({view:'settings'})} icon="⚙">Settings</NavBtn>
          <div style={{padding:'9px 11px 0'}}>
            <SyncDot state={cloud.state} compact/>
            <div style={{fontSize:10, color:T.dimmer, marginTop:3}}>
              {fs.dir ? 'OneDrive backup on' : 'local + cloud'}
            </div>
          </div>
        </div>
      </aside>

      {mobileOpen && window.innerWidth<860 &&
        <div onClick={()=>setMobileOpen(false)}
          style={{position:'fixed', inset:0, background:'rgba(0,0,0,.55)', zIndex:40}}/>}

      <main style={{flex:1, overflowY:'auto', padding:'26px 30px 70px', minWidth:0}}>
        {window.innerWidth<860 && (
          <button onClick={()=>setMobileOpen(true)}
            style={{marginBottom:16, color:T.dim, fontSize:20}}>&#9776;</button>
        )}
        <div style={{maxWidth:1020, margin:'0 auto'}}>
          {cloud.state.status==='down' && (
            <div style={{background:T.bad+'14', border:'1px solid '+T.bad+'55', borderRadius:12,
              padding:'12px 15px', marginBottom:18, display:'flex', gap:12,
              alignItems:'center', flexWrap:'wrap'}}>
              <div style={{flex:1, minWidth:220}}>
                <div style={{fontSize:13, fontWeight:700, color:T.bad}}>
                  Not syncing — {cloud.state.err}
                </div>
                <div style={{fontSize:11.5, color:T.dim, marginTop:3, lineHeight:1.55}}>
                  Changes are saving on this device only. Your laptop will not see them until this clears.
                </div>
              </div>
              <Btn ghost tone={T.bad} onClick={cloud.pull}>Retry</Btn>
            </div>
          )}
          {body}
        </div>
      </main>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

/* Offline shell. Registered after render so a failure here can never stop the
   app from booting. Only over https — a service worker cannot install on the
   file:// or plain-http local copy, and that is fine. */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

</script>
</body>
</html>
