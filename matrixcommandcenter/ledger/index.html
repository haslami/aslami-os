<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<meta name="robots" content="noindex">
<title>Matrix Ledger</title>
<link rel="icon" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;800&display=swap">
<!-- Loaded before the app script so the sync layer can see window.supabase on first run. -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<body>
<style>
:root{
  --bg:#0B0E13; --surf:#141922; --surf2:#1B2230; --surf3:#232C3C;
  --ink:#EAEEF5; --ink2:#AEB9C9; --mut:#7C8899; --line:#242D3B; --line2:#334052;
  --accent:#FF6B2C; --accent-ink:#180800; --accent-soft:#2A1409;
  --pos:#2ED8A0; --pos-soft:#0C2E25; --neg:#FF5D6C; --neg-soft:#2E1216;
  --warn:#F0B23E; --warn-soft:#2E240E; --cash:#4EA8FF; --cash-soft:#0D2540;
  --r:14px; --shadow:0 1px 0 #ffffff08 inset, 0 18px 40px -24px #000C;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F2F4F8; --surf:#FFFFFF; --surf2:#F5F7FA; --surf3:#E9EDF3;
    --ink:#0D1117; --ink2:#3B4757; --mut:#68748A; --line:#DFE5EC; --line2:#C9D3DF;
    --accent:#D8501A; --accent-ink:#FFFFFF; --accent-soft:#FDEBE2;
    --pos:#0B8A63; --pos-soft:#DCF3EA; --neg:#C0343E; --neg-soft:#FBE5E7;
    --warn:#9A6A0C; --warn-soft:#FAF0DA; --cash:#1466B8; --cash-soft:#E1EEFB;
    --shadow:0 1px 2px #0D111708, 0 14px 32px -22px #0D111740;
  }
}
:root[data-theme="light"]{
  --bg:#F2F4F8; --surf:#FFFFFF; --surf2:#F5F7FA; --surf3:#E9EDF3;
  --ink:#0D1117; --ink2:#3B4757; --mut:#68748A; --line:#DFE5EC; --line2:#C9D3DF;
  --accent:#D8501A; --accent-ink:#FFFFFF; --accent-soft:#FDEBE2;
  --pos:#0B8A63; --pos-soft:#DCF3EA; --neg:#C0343E; --neg-soft:#FBE5E7;
  --warn:#9A6A0C; --warn-soft:#FAF0DA; --cash:#1466B8; --cash-soft:#E1EEFB;
  --shadow:0 1px 2px #0D111708, 0 14px 32px -22px #0D111740;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono,.num,td.n,th.n{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:900px){ .app{grid-template-columns:214px 1fr} }
.side{background:var(--surf);border-right:1px solid var(--line);padding:1rem .8rem;display:flex;flex-direction:column;gap:.15rem}
@media(max-width:899px){ .side{position:fixed;bottom:0;left:0;right:0;z-index:40;flex-direction:row;border-right:none;
  border-top:1px solid var(--line);padding:.35rem;overflow-x:auto;gap:.2rem} }
.brand{display:flex;align-items:center;gap:.55rem;padding:.2rem .5rem 1rem}
@media(max-width:899px){ .brand{display:none} }
.dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,var(--accent),#FF9A5C);flex:0 0 auto}
.brand b{font-weight:800;letter-spacing:-.02em}
.brand span{display:block;font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.nav{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:10px;border:none;background:none;
  color:var(--ink2);font:inherit;font-weight:600;cursor:pointer;width:100%;text-align:left;white-space:nowrap;font-size:.92rem}
.nav:hover{background:var(--surf2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav i{width:16px;text-align:center;font-style:normal;flex:0 0 auto}
@media(max-width:899px){ .nav{flex-direction:column;gap:.1rem;font-size:.58rem;padding:.35rem .45rem;min-width:58px;text-align:center} }
.side .spacer{flex:1}
.syncbox{font-family:"JetBrains Mono",monospace;font-size:.58rem;color:var(--mut);padding:.5rem .6rem;line-height:1.5}
@media(max-width:899px){ .syncbox{display:none} }
main{padding:clamp(.9rem,2.5vw,1.8rem);padding-bottom:5.5rem;max-width:1180px}
@media(min-width:900px){ main{padding-bottom:2rem} }

.top{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.1rem}
.top h1{font-size:1.32rem;font-weight:800;letter-spacing:-.03em;margin:0;margin-right:auto}
.top h1 small{display:block;font-size:.68rem;font-weight:500;color:var(--mut);letter-spacing:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line2);
  border-radius:10px;padding:.42rem .6rem;min-width:0}
textarea{font-family:"JetBrains Mono",monospace;font-size:.78rem}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,.nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid var(--line2);
  background:var(--surf);color:var(--ink);padding:.42rem .8rem}
button:hover{background:var(--surf2)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.sm{padding:.26rem .55rem;font-size:.8rem;font-weight:500}
button.danger{color:var(--neg)}
button.ghost{background:none}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;box-shadow:var(--shadow);margin-bottom:.9rem}
.card>:last-child{margin-bottom:0}
.card h2{font-size:.95rem;font-weight:700;margin:0 0 .2rem;letter-spacing:-.01em}
.card .sub{color:var(--mut);font-size:.82rem;margin:0 0 .8rem}
.hero{background:radial-gradient(120% 140% at 100% 0%, color-mix(in srgb,var(--accent) 16%,transparent) 0%, transparent 55%),var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.hero .lbl{font-family:"JetBrains Mono",monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.hero .big{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;letter-spacing:-.04em;line-height:1;margin:.3rem 0 .1rem}
.hero .big.pos{color:var(--pos)} .hero .big.neg{color:var(--neg)}
.hero .strip{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin-top:.7rem;font-size:.82rem;color:var(--ink2)}
.hero .strip b{font-family:"JetBrains Mono",monospace}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.6rem,1fr));gap:.6rem;margin-bottom:.9rem}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;box-shadow:var(--shadow)}
.kpi .k{font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:.25rem}
.kpi .v{font-size:1.22rem;font-weight:800;letter-spacing:-.03em;display:block;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.71rem;color:var(--mut);display:block;margin-top:.1rem}
.kpi.pos .v{color:var(--pos)} .kpi.neg .v{color:var(--neg)} .kpi.warn .v{color:var(--warn)} .kpi.cash .v{color:var(--cash)}
.pill{display:inline-flex;align-items:center;gap:.28rem;font-family:"JetBrains Mono",monospace;font-size:.56rem;
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.22em .5em;border-radius:5px;white-space:nowrap}
.pill.solo{background:var(--accent-soft);color:var(--accent)}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.mut{background:var(--surf3);color:var(--mut)}
.pill.cash{background:var(--cash-soft);color:var(--cash)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:.46rem .65rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--surf2);font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:700}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surf2)}
td.n,th.n{text-align:right}
tfoot td{font-weight:800;background:var(--surf2);border-top:1px solid var(--line2)}
.empty{padding:1.8rem;text-align:center;color:var(--mut);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.4rem,1fr));gap:.55rem}
.f{display:flex;flex-direction:column;gap:.22rem}
.f label{font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.f input,.f select{width:100%}
.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.75rem}
.hint{font-size:.78rem;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr;gap:.9rem}
@media(min-width:920px){ .two{grid-template-columns:1fr 1fr} }
.view[hidden]{display:none}

/* money moves */
.move{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:start;padding:.7rem .8rem;
  border:1px solid var(--line);border-radius:12px;background:var(--surf2);margin-bottom:.5rem}
.move.done{opacity:.5}
.move .tick{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line2);background:var(--surf);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;padding:0;flex:0 0 auto}
.move.done .tick{background:var(--pos);border-color:var(--pos);color:#04140F}
.move .what{font-weight:700;letter-spacing:-.01em}
.move .why{font-size:.79rem;color:var(--mut);margin-top:.15rem}
.move .amt{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:1.05rem;white-space:nowrap;text-align:right}
.move.cash{border-left:3px solid var(--cash)} .move.bank{border-left:3px solid var(--accent)}
.move.save{border-left:3px solid var(--pos)} .move.qb{border-left:3px solid var(--warn)}
.grouplbl{font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--mut);margin:1rem 0 .45rem}
.grouplbl:first-child{margin-top:0}
.checks{display:grid;gap:.3rem}
.chk{display:flex;gap:.55rem;align-items:flex-start;font-size:.85rem;padding:.32rem .5rem;border-radius:8px;background:var(--surf2)}
.chk .ic{flex:0 0 auto;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.68rem;padding:.1rem .35rem;border-radius:4px}
.chk.ok .ic{background:var(--pos-soft);color:var(--pos)}
.chk.no .ic{background:var(--neg-soft);color:var(--neg)}
.chk.wa .ic{background:var(--warn-soft);color:var(--warn)}
.qb{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.6rem}
.qbcard{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.qbcard .nm{font-weight:800;letter-spacing:-.02em;margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.qbrow{display:flex;justify-content:space-between;gap:.8rem;font-size:.83rem;padding:.14rem 0}
.qbrow span:last-child{font-family:"JetBrains Mono",monospace}
.qbrow.tot{border-top:1px solid var(--line2);margin-top:.28rem;padding-top:.32rem;font-weight:800}
.spendrow{display:grid;grid-template-columns:1fr 7.5rem 4.5rem;gap:.5rem;align-items:center;margin-bottom:.35rem}
.spendrow .track{grid-column:1/-1;background:var(--surf3);border-radius:4px;height:6px;overflow:hidden;margin-top:-.15rem}
.spendrow .fill{height:100%;background:var(--accent);border-radius:4px}
.spendrow input{text-align:right;font-family:"JetBrains Mono",monospace}
.spendrow .pc{font-family:"JetBrains Mono",monospace;font-size:.76rem;color:var(--mut);text-align:right}
svg.chart{display:block;width:100%;height:auto;min-width:520px}
.chartwrap{overflow-x:auto}
.grid line{stroke:var(--line)} .axis text{fill:var(--mut);font-size:10px;font-family:"JetBrains Mono",monospace}
.zero{stroke:var(--line2);stroke-width:1.5}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surf3);color:var(--ink);border:1px solid var(--line2);
  border-radius:9px;padding:.45rem .6rem;font-size:.78rem;box-shadow:var(--shadow);opacity:0;transition:opacity .1s}
.tip b{font-family:"JetBrains Mono",monospace}
.toast{position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%);background:var(--surf3);color:var(--ink);
  border:1px solid var(--line2);border-radius:10px;padding:.55rem .9rem;font-size:.85rem;box-shadow:var(--shadow);
  opacity:0;transition:opacity .2s;z-index:90;pointer-events:none;max-width:92vw}
@media(min-width:900px){ .toast{bottom:1.5rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="side" aria-label="Sections">
    <div class="brand"><span class="dot"></span><span><b>Matrix Ledger</b><span>Finance</span></span></div>
    <button class="nav" data-v="period" aria-current="true"><i>◧</i>Period</button>
    <button class="nav" data-v="moves"><i>⇄</i>Money moves</button>
    <button class="nav" data-v="payroll"><i>◉</i>Payroll</button>
    <button class="nav" data-v="jobs"><i>▤</i>Jobs</button>
    <button class="nav" data-v="spend"><i>◈</i>Spend</button>
    <button class="nav" data-v="months"><i>▦</i>Months</button>
    <button class="nav" data-v="year"><i>◪</i>Year</button>
    <button class="nav" data-v="setup"><i>⚙</i>Setup</button>
    <span class="spacer"></span>
    <div class="syncbox" id="syncbox"></div>
  </nav>
  <main>
    <div class="top">
      <h1 id="viewTitle">Pay period<small id="viewSub"></small></h1>
      <select id="periodSel" aria-label="Pay period"></select>
      <button class="sm" id="btnToday">Today</button>
    </div>
    <section class="view" id="v-period"></section>
    <section class="view" id="v-moves" hidden></section>
    <section class="view" id="v-payroll" hidden></section>
    <section class="view" id="v-jobs" hidden></section>
    <section class="view" id="v-spend" hidden></section>
    <section class="view" id="v-months" hidden></section>
    <section class="view" id="v-year" hidden></section>
    <section class="view" id="v-setup" hidden></section>
  </main>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round(n*100)/100;
const money=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");
const pct=n=>isFinite(n)?(n*100).toFixed(1)+"%":"—";
const uid=()=>Math.random().toString(36).slice(2,10);
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/[$,\s]/g,""));return isFinite(n)?n:0;};

const DAY=86400000, ANCHOR=Date.UTC(2025,11,29);
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const PERIODS=(()=>{const o=[];for(let i=0;i<27;i++){const s=ANCHOR+i*14*DAY,e=s+13*DAY;
  const sd=new Date(s),ed=new Date(e);
  o.push({id:"PP"+String(i+1).padStart(2,"0"),start:s,end:e,
    short:MN[sd.getUTCMonth()]+" "+sd.getUTCDate()+" – "+MN[ed.getUTCMonth()]+" "+ed.getUTCDate(),
    label:"PP"+String(i+1).padStart(2,"0")+"  "+MN[sd.getUTCMonth()]+" "+sd.getUTCDate()+"–"+MN[ed.getUTCMonth()]+" "+ed.getUTCDate()});}
  return o;})();
const toUTC=iso=>{const p=String(iso).split("-").map(Number);return Date.UTC(p[0],(p[1]||1)-1,p[2]||1);};
const periodOf=iso=>{const t=toUTC(iso);return PERIODS.find(p=>t>=p.start&&t<=p.end)||null;};
const fmtD=iso=>{const p=String(iso).split("-");return (+p[1])+"/"+(+p[2]);};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

/* EVERY upgrade lives in here, and every path that loads state must run it —
   boot, AND adopting a copy pulled from the cloud. A device syncing a state
   saved by an older build used to skip all of this silently, which left
   soloBonus undefined and quietly paid solo jobs at the plain two-man rate. */
function migrate_(st){
  if(!st || !st.settings) return st;
  try{ if((st.v||0)<4){ st.settings.reserve=st.settings.reserve||{incomeTax:.20,ksSalesTax:.10};
    st.settings.reserve.taxBase="transfer"; st.v=4; } }catch(e){}
  /* v5: bonuses / reimbursements / deductions */
  try{ if((st.v||0)<5){ st.extras=st.extras||{}; st.v=5; } }catch(e){}
  /* v6: a crew member who leaves is deactivated, never deleted. v5 deleted
     Hayden, which zeroed his commission on every period he had worked. */
  try{ if((st.v||0)<6){
    var T=st.settings.techs||(st.settings.techs=[]);
    T.forEach(function(t){ if(t.active===undefined) t.active=true; });
    if(!T.some(function(t){return t.name==="Hayden";})) T.push({name:"Hayden",role:"Technician",active:false});
    st.v=6; } }catch(e){}
  /* v7: role labels. Tech -> Team Lead (25%), Junior -> Technician (22.5%). */
  try{ if((st.v||0)<7){
    (st.settings.techs||[]).forEach(function(t){
      if(t.role==="Tech") t.role="Team Lead";
      else if(t.role==="Junior") t.role="Technician"; });
    st.v=7; } }catch(e){}
  /* v8: solo is a BONUS on top of the person's own rate, not a flat rate. The
     old flat 0.40 was right for a Team Lead (25+15) but overpaid every
     Technician working alone — 40% instead of 37.5%. */
  try{ if((st.v||0)<8){ var R8=st.settings.rates||(st.settings.rates={});
    if(R8.soloBonus===undefined) R8.soloBonus=0.15;
    delete R8.solo;
    st.v=8; } }catch(e){}
  /* v9: online booking deposits taken on Stripe. */
  try{ if((st.v||0)<9){
    if(st.settings.depositAmount===undefined) st.settings.depositAmount=50;
    if(st.settings.methods && st.settings.methods.indexOf("Stripe (online)")<0)
      st.settings.methods.splice(Math.max(0,st.settings.methods.length-1),0,"Stripe (online)");
    (st.jobs||[]).forEach(function(j){ if(j.deposit===undefined) j.deposit=0; });
    st.v=9; } }catch(e){}
  /* v10: Gannon and Hayden have both left. DEACTIVATED, not deleted — the crew
     list is also the commission-rate lookup, so removing a name pays every past
     period they worked at 0%. */
  try{ if((st.v||0)<10){
    (st.settings.techs||[]).forEach(function(t){
      if(t.name==="Gannon"||t.name==="Hayden") t.active=false; });
    st.v=10; } }catch(e){}
  /* belt and braces: a rate or setting must never be undefined, whatever the
     version says, because an undefined rate pays somebody the wrong amount. */
  try{ if(st.settings.rates.soloBonus===undefined) st.settings.rates.soloBonus=0.15; }catch(e){}
  try{ if(st.settings.depositAmount===undefined) st.settings.depositAmount=50; }catch(e){}
  if(!st.extras) st.extras={};
  return st;
}

function sinceTxt(ms){
  if(!ms) return "never";
  const s=Math.round((Date.now()-ms)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.round(s/60)+" min ago";
  if(s<86400) return Math.round(s/3600)+" hr ago";
  return Math.round(s/86400)+" days ago";
}

   than the artifact's file store; inside claude.ai it is still the file store.
   The scheduling above is unchanged — 12 seconds of quiet, plus a flush when the
   tab is hidden or closed — only the transport differs.
   The ledger is the system of record. The Command Center only ever READS what
   this pushes, so the money math lives in one place: if the Finance page
   re-derived it, the first rate change would make two screens disagree and both
   would look right.
   Conflict rule: last write wins on savedAt, and a device only ADOPTS a copy
   strictly newer than its own, so a stale tab cannot overwrite the day's work.
   ============================================================ */

/* The finished numbers, computed here and shipped ready to render. Mirrors the
   Year view exactly: a period reads LIVE the moment anything is logged into it,
   and falls back to what the original workbook recorded until then, so the year
   is whole from January rather than from the day this app started. */
function ledgerSummary(){
  const rows=PERIODS.map(p=>{
    const t=totals(p.id), P=plan(p.id), h=HISTORY[p.id];
    const live=t.jobs>0||t.opex>0;
    /* The old book's "Total Expenses" bundles payroll, payroll tax and owner pay
       in with everything else. The ledger keeps labor and spend apart, so strip
       the labor back out — otherwise labor gets counted twice in the year. */
    const hLab=h?r2(((h.exp&&h.exp["Payroll"])||0)+((h.exp&&h.exp["Payroll tax"])||0)+((h.exp&&h.exp["Owner work pay"])||0)):0;
    return {id:p.id, label:p.label, short:p.short, start:isoOf(p.start), end:isoOf(p.end),
      live, basis:live?"ledger":"old book",
      revenue:live?t.revenue:(h?h.gross:0),
      opex:live?t.opex:(h?r2(Math.max(0,h.totalExp-hLab)):0),
      net:live?t.net:(h?h.net:0),
      labor:live?t.labor:hLab,
      ownerPay:live?P.ownerPay:(h?r2((h.exp&&h.exp["Owner work pay"])||0):0),
      jobs:live?t.jobs:(h?h.jobCount:0),
      ksSales:live?t.ksSales:(h?h.ks:0),
      tips:live?t.tips:0, cashIn:live?t.cashIn:0, hours:live?t.hours:0,
      toSavings:live?P.toSavings:0};
  }).filter(r=>r.live||HISTORY[r.id]);

  const add=(rs,k)=>r2(rs.reduce((a,r)=>a+r[k],0));
  const roll=rs=>({periods:rs.length, revenue:add(rs,"revenue"), labor:add(rs,"labor"),
    opex:add(rs,"opex"), net:add(rs,"net"), jobs:rs.reduce((a,r)=>a+r.jobs,0)});
  const liveRows=rows.filter(r=>r.live), oldRows=rows.filter(r=>!r.live);
  const y=roll(rows);
  const year=Object.assign(y,{
    tips:add(rows,"tips"), cashIn:add(rows,"cashIn"), ksSales:add(rows,"ksSales"),
    ownerPay:add(rows,"ownerPay"), hours:add(rows,"hours"), toSavings:add(rows,"toSavings"),
    laborPct:y.revenue?y.labor/y.revenue:null, netPct:y.revenue?y.net/y.revenue:null,
    /* The two sources do not measure the same thing — old-book revenue includes
       tips and Kansas sales tax, ledger revenue excludes both. Ship the split so
       the Finance page can say so instead of printing one dishonest total. */
    mixed:liveRows.length>0&&oldRows.length>0, ledger:roll(liveRows), oldBook:roll(oldRows)});
  const cur=periodOf(todayISO());
  return {v:1, builtAt:Date.now(), savedAt:S.savedAt||0, currentPeriod:cur?cur.id:null,
    year, periods:rows, monthly:monthlySeries(rows)};
}

/* Months are exact where the ledger holds job dates, and prorated by day across
   the pay period where the old book is the only source. */
function monthlySeries(rows){
  /* PP01 opens on 29 Dec 2025 but the book it came from calls that January, and
     so does the Year view. Fold those three days forward rather than putting a
     stray "Dec" bar in front of a 2026 chart. */
  const key=k=>k<"2026-01"?"2026-01":k;
  const m={};
  const bucket=k=>{ k=key(k); return m[k]||(m[k]={revenue:0,labor:0,opex:0,net:0,jobs:0,tips:0}); };
  const liveIds={}; rows.forEach(r=>{ if(r.live) liveIds[r.id]=1; });

  /* Live revenue is exact — every job carries its own date. Remember how each
     period's revenue split across months, so that period's costs can follow the
     same shape instead of being smeared evenly. */
  const split={};
  S.jobs.forEach(j=>{ if(j.status!=="Completed") return;
    const p=periodOf(j.date); if(!p||!liveIds[p.id]) return;
    const k=key(String(j.date).slice(0,7)), b=bucket(k);
    b.revenue+=num(j.price); b.tips+=num(j.tip); b.jobs++;
    (split[p.id]||(split[p.id]={}))[k]=(split[p.id][k]||0)+num(j.price); });

  const byDay=(r,fn)=>{ const s=toUTC(r.start), e=toUTC(r.end),
    days=Math.max(1,Math.round((e-s)/DAY)+1);
    for(let i=0;i<days;i++) fn(key(new Date(s+i*DAY).toISOString().slice(0,7)), 1/days); };

  /* Labor, spend and net are period-level facts — a fortnight straddles two
     months. Weight them by where that period actually earned. NET is prorated
     rather than recomputed, which is what keeps the months adding up to exactly
     the year total instead of drifting by a few dollars of rounding. */
  rows.forEach(r=>{
    const sp = r.live ? split[r.id] : null;
    const tot = sp ? Object.keys(sp).reduce((a,k)=>a+sp[k],0) : 0;
    const put = (k,w)=>{ const b=bucket(k);
      b.labor+=r.labor*w; b.opex+=r.opex*w; b.net+=r.net*w;
      if(!r.live){ b.revenue+=r.revenue*w; b.jobs+=r.jobs*w; } };
    if(tot>0) Object.keys(sp).forEach(k=>put(k, sp[k]/tot));
    else byDay(r,put);
  });

  return Object.keys(m).sort().map(k=>{ const b=m[k];
    return {monthKey:k, month:MN[+k.slice(5,7)-1],
      revenue:r2(b.revenue), labor:r2(b.labor), opex:r2(b.opex), net:r2(b.net),
      jobs:Math.round(b.jobs), tips:r2(b.tips),
      netPct: b.revenue ? b.net/b.revenue : null,
      laborPct: b.revenue ? b.labor/b.revenue : null}; });
}

/* Push. Throws on refusal so cloudSave's existing retry/backoff handles it. */
async function supaPush(snapshot){
  const updated_at=new Date().toISOString();
  const { error } = await supa.from(SUPA_TABLE).upsert({
    id:SUPA_ROW,
    data:{ savedAt:S.savedAt||0, state:JSON.parse(snapshot), summary:ledgerSummary() },
    updated_at });
  if(error) throw new Error(error.message||"the database refused the write");
}

function adoptCloud(st, at){
  /* Run the upgrades on anything arriving from the cloud. Another device may
     have saved it on an older build, and adopting it raw would silently roll
     this device back — that is how solo jobs ended up paying the two-man rate
     on a freshly opened phone. */
  S=migrate_(st); if(!S.extras) S.extras={};
  cloudDirty=false; cloudAt=at||Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); localAt=Date.now(); }catch(e){}
  fillPeriods(); renderAll();
  toast("Loaded the newer copy from the cloud.");
}

async function cloudPull(){
  if(!supa) return;
  try{
    const { data, error } = await supa.from(SUPA_TABLE)
      .select("data,updated_at").eq("id",SUPA_ROW).maybeSingle();
    if(error){ cloudFail++; paintSync(); return; }
    const st = data && data.data && data.data.state;
    if(!st || !st.settings || !Array.isArray(st.jobs)){
      /* Nothing usable up there yet — this device seeds it. */
      if(S.jobs.length||Object.keys(S.spend||{}).length){ cloudDirty=true; scheduleCloud(); }
      return;
    }
    if(!S.savedAt || st.savedAt>S.savedAt) adoptCloud(st, Date.parse(data.updated_at));
    else if(S.savedAt > (st.savedAt||0)+1000){ cloudAt=Date.parse(data.updated_at)||0; cloudDirty=true; scheduleCloud(); }
    else { cloudAt=Date.parse(data.updated_at)||0; cloudDirty=false; }
    paintSync();
  }catch(e){ cloudFail++; paintSync(); }
}

function cloudWatch(){
  if(!supa) return;
  supa.channel("matrix-ledger")
    .on("postgres_changes",{event:"*",schema:"public",table:SUPA_TABLE,filter:"id=eq."+SUPA_ROW},
      pl=>{ const st = pl && pl.new && pl.new.data && pl.new.data.state;
        if(st && st.settings && Array.isArray(st.jobs) && st.savedAt>(S.savedAt||0))
          adoptCloud(st, Date.parse(pl.new.updated_at)); })
    .subscribe();
  addEventListener("focus",()=>{ cloudPull(); });
}

/* Two-click confirmation. window.confirm/prompt/alert are BLOCKED in the
   artifact sandbox — they return false/null without ever showing anything, so
   any "if(!confirm(...)) return" silently does nothing at all. First click arms
   the control and shows what it is about to do; a second click within 4 seconds
   goes through. Clicking anywhere else, or waiting, cancels. */
function arm(el, done){
  if(!el) return;
  const label=el.textContent, cls=el.className;
  let armed=false, t=null;
  const reset=()=>{armed=false;clearTimeout(t);el.textContent=label;el.className=cls;};
  el.addEventListener("click",e=>{
    e.stopPropagation();
    if(armed){ reset(); done(); return; }
    armed=true; el.textContent="Click again to confirm"; el.className=cls+" danger";
    t=setTimeout(reset,4000);
    document.addEventListener("click",function once(){document.removeEventListener("click",once);reset();},{once:true});
  });
}

    /* Inside claude.ai the artifact's own file store is the cloud. */
    try{ const r=await fetch("data/ledger.json",{cache:"no-store"});
      if(r.ok){ const o=await r.json();
        if(o&&o.settings){
          cloudAt=o.savedAt||0;
          if(!S.savedAt||o.savedAt>S.savedAt){
            /* The cloud copy is newer — another device did the work. Take it. */
            S=migrate_(o); if(!S.extras)S.extras={}; cloudDirty=false; fillPeriods(); renderAll();
            toast("Loaded the newer copy from the cloud.");
          } else if(S.savedAt>(o.savedAt||0)+1000){
            /* This device is ahead. Push it up rather than sitting on the only copy. */
            cloudDirty=true; scheduleCloud();
          } else { cloudDirty=false; }
        } }
    }catch(e){}
  }
  /* On the hosted copy the cloud is Supabase, and the Command Center reads the
     summary this pushes. */
  if(supa){ await cloudPull(); cloudWatch(); }
  paintSync(); })();
/* auto=true is the background backup: no toast unless something is wrong. */
async function cloudSave(auto){
  if(!cloud&&!supa){ if(!auto) toast("Cloud sync unavailable here. Use Download backup."); return; }
  if(cloudBusy){ scheduleCloud(); return; }
  cloudBusy=true; paintSync();
  const snapshot=JSON.stringify(S);
  try{
    /* Supabase on the hosted copy, the artifact's file store inside claude.ai. */
    if(supa) await supaPush(snapshot);
    else await cloud.publish({"data/ledger.json":snapshot});
    cloudAt=Date.now(); cloudFail=0;
    // anything typed while the upload was in flight still needs sending
    cloudDirty = (JSON.stringify(S)!==snapshot);
    if(cloudDirty) scheduleCloud();
    if(!auto) toast(supa?"Synced. The Command Center has these numbers.":"Backed up to the cloud.");
  }catch(e){
    cloudFail++;
    if(!auto||cloudFail===2) toast("Cloud sync failed"+(e&&(e.code||e.message)?" ("+(e.code||e.message)+")":"")+
      ". Your device copy is fine — download a backup to be safe.");
    if(cloudFail<5) cloudT=setTimeout(()=>cloudSave(true), 30000*cloudFail);  // back off, keep trying
  }finally{ cloudBusy=false; paintSync(); }
}

/* ---------------- derivation ---------------- */
/* Roles map to a rate KEY, not to a rate. The keys never change, so renaming a
   role is a label change only. Both the old names ("Tech", "Junior") and the new
   ones resolve — an unrecognised role would silently pay 0%, which is exactly
   how a deleted crew member once zeroed a whole pay period. */
const ROLES=["Owner","Team Lead","Technician"];
const ROLE_RATE={Owner:"owner","Team Lead":"team",Technician:"junior",
                 Tech:"team",Junior:"junior"};          // legacy names, keep forever
/* Solo pays the person's OWN rate plus a bonus — it is not a flat rate for
   everybody. A Team Lead on 25% earns 40% solo; a Technician on 22.5% earns
   37.5%. Treating solo as one fixed number overpaid every Technician who
   worked alone. */
/* NOT r2() — that rounds to two decimals, which is right for dollars and wrong
   for a rate: 22.5% + 15% would land on 38% instead of 37.5%. Six decimals keeps
   the half-percent and still kills floating-point dust. */
const rateFor=(n,solo)=>Math.round((baseRate(n)+(solo?(S.settings.rates.soloBonus||0):0))*1e6)/1e6;
const techRole=n=>{const t=S.settings.techs.find(x=>x.name===n);return t?t.role:null;};
const isOwner=n=>techRole(n)==="Owner";
const baseRate=n=>{const r=S.settings.rates,ro=techRole(n);
  var k=ROLE_RATE[ro]; return k?r[k]:0;};
function lines(j){
  const techs=(j.techs||[]).filter(Boolean), crew=techs.length; if(!crew) return [];
  const solo=crew===1, done=j.status==="Completed";
  return techs.map((name,i)=>{
    const rate=rateFor(name,solo);
    return {job:j,name,crew,solo,rate,comm:done?r2(num(j.price)*rate):0,
      tip:r2(num(j.tip)/crew), tipCash:!!j.tipCash,
      adj:(j.adj&&j.adj[i])||0, hours:num(j.hours)};
  });
}
const jobsIn=p=>S.jobs.filter(j=>{const x=periodOf(j.date);return x&&x.id===p;});
const spendOf=p=>S.spend[p]||{};
const spendTotal=p=>{const s=spendOf(p);return r2(Object.keys(s).reduce((a,k)=>a+num(s[k]),0));};

/* Bonuses, reimbursements and deductions — the three things that are NOT
   commission but still change what somebody gets paid. They are kept apart
   because the tax treatment differs:
     Bonus         taxable wages. Goes in the QuickBooks gross, employer tax applies.
     Reimbursement NOT wages. He spent his own money on the business and is being
                   paid back, so no payroll tax — and it is a business expense.
     Deduction     reduces taxable wages (a tool he broke, training time, etc).
   The original workbook hid all three inside the tip columns, which overstated
   tips and understated wages. */
const EXTRA_TYPES=["Bonus","Reimbursement","Deduction"];
const extrasIn=p=>(S.extras&&S.extras[p])||[];
function extrasBy(p){
  const by={};
  extrasIn(p).forEach(e=>{
    const r=by[e.name]||(by[e.name]={bonus:0,reimb:0,deduct:0,items:[]});
    const a=num(e.amount);
    if(e.type==="Reimbursement") r.reimb+=a;
    else if(e.type==="Deduction") r.deduct+=a;
    else r.bonus+=a;
    r.items.push(e);
  });
  return by;
}
function extraSplit(p){
  const by=extrasBy(p);
  const o={empBonus:0,empReimb:0,empDeduct:0,ownBonus:0,ownReimb:0,ownDeduct:0};
  Object.keys(by).forEach(n=>{const e=by[n];
    if(isOwner(n)){o.ownBonus+=e.bonus;o.ownReimb+=e.reimb;o.ownDeduct+=e.deduct;}
    else {o.empBonus+=e.bonus;o.empReimb+=e.reimb;o.empDeduct+=e.deduct;}});
  Object.keys(o).forEach(k=>o[k]=r2(o[k]));
  return o;
}

function totals(p){
  const js=jobsIn(p), done=js.filter(j=>j.status==="Completed");
  const revenue=r2(done.reduce((a,j)=>a+num(j.price),0));
  const tips=r2(done.reduce((a,j)=>a+num(j.tip),0));
  let ownerComm=0, empComm=0, tipOut=0, adj=0, hours=0;
  js.forEach(j=>lines(j).forEach(l=>{
    if(isOwner(l.name)) ownerComm+=l.comm; else empComm+=l.comm;
    tipOut+=l.tip; adj+=l.adj; hours+=l.hours; }));
  /* A tip marked "cash tip split" was handed over and divided on the spot. The
     crew already have it, and the business never held it. It must NOT ride into
     the QuickBooks gross or they get paid the same tip twice. */
  const empTips=r2(js.reduce((a,j)=>a+lines(j).filter(l=>!isOwner(l.name)).reduce((b,l)=>b+l.tip,0),0));
  const empTipsCash=r2(js.reduce((a,j)=>a+lines(j).filter(l=>!isOwner(l.name)&&l.tipCash).reduce((b,l)=>b+l.tip,0),0));
  const empTipsPay=r2(empTips-empTipsCash);
  const tipsCash=r2(js.reduce((a,j)=>a+lines(j).filter(l=>l.tipCash).reduce((b,l)=>b+l.tip,0),0));
  const empAdj=r2(js.reduce((a,j)=>a+lines(j).filter(l=>!isOwner(l.name)).reduce((b,l)=>b+l.adj,0),0));
  const ownerTips=r2(tipOut-empTips), ownerAdj=r2(adj-empAdj);
  const X=extraSplit(p);
  // Gross wages = what goes on the QuickBooks pay run (tips and bonuses in,
  // reimbursements OUT — a reimbursement is not earnings and is not taxed).
  const empWages=r2(empComm+empTipsPay+empAdj+X.empBonus-X.empDeduct);
  const empTax=r2(empWages*S.settings.rates.tax);
  // COST to the business excludes tips: they arrive from the customer and leave
  // to the crew, and they were never counted in revenue, so they must not be
  // subtracted from it either. Owners are a draw, so no employer tax on them.
  const empCost=r2(empComm+empAdj+X.empBonus-X.empDeduct+empTax);
  const ownerCost=r2(ownerComm+ownerAdj+X.ownBonus-X.ownDeduct);
  // Money the crew laid out for the business and is getting back. Not labor —
  // it is the underlying expense, so it sits on its own line.
  const reimb=r2(X.empReimb+X.ownReimb);
  const opex=spendTotal(p);
  const net=r2(revenue-ownerCost-empCost-opex-reimb);
  /* Online bookings pay a deposit through Stripe before the job. That money
     settles like a Missouri card, not as cash and not as whatever they hand over
     on the driveway — so the payment method describes only the BALANCE. */
  const deposits=r2(done.reduce((a,j)=>a+num(j.deposit),0));
  /* Cash in hand, available to pay owners. A tip the crew split themselves never
     reached the till, and neither did a deposit already paid online. */
  const cashIn=r2(done.filter(j=>S.settings.cashMethods.indexOf(j.payment)>-1)
    .reduce((a,j)=>a+Math.max(0,num(j.price)-num(j.deposit))+(j.tipCash?0:num(j.tip)),0));
  /* Kansas sales tax follows where the WORK happened, not how it was paid. The
     deposit stays in the Kansas base even though Stripe settles like a Missouri
     card — dropping it here would quietly under-reserve the tax. */
  const ksSales=r2(done.filter(j=>S.settings.ksMethods.indexOf(j.payment)>-1).reduce((a,j)=>a+num(j.price),0));
  const labor=r2(ownerCost+empCost);
  return {revenue,tips,ownerComm:r2(ownerComm),empComm:r2(empComm),empTips,empAdj,ownerTips,ownerAdj,
    empWages,empTax,empCost,ownerCost,reimb,x:X,deposits,
    tipsCash,empTipsCash,empTipsPay,
    tipOut:r2(tipOut),adj:r2(adj),hours:r2(hours),opex,net,cashIn,ksSales,labor,
    jobs:done.length, solo:done.filter(j=>(j.techs||[]).filter(Boolean).length===1).length,
    avg:done.length?revenue/done.length:0,
    laborPct:revenue?labor/revenue:NaN, netPct:revenue?net/revenue:NaN};
}
function payroll(p){
  const by={}, EX=extrasBy(p);
  const blankRow=n=>({name:n,role:techRole(n)||"—",jobs:0,rev:0,comm:0,tip:0,tipCash:0,adj:0,hours:0,solo:0,
                      bonus:0,reimb:0,deduct:0,items:[]});
  jobsIn(p).forEach(j=>lines(j).forEach(l=>{
    const r=by[l.name]||(by[l.name]=blankRow(l.name));
    r.jobs++;r.rev+=num(l.job.price);r.comm+=l.comm;r.tip+=l.tip;
    if(l.tipCash) r.tipCash+=l.tip;
    r.adj+=l.adj;r.hours+=l.hours;if(l.solo)r.solo++;}));
  // Somebody can have a bonus or a reimbursement in a period they worked no jobs.
  Object.keys(EX).forEach(n=>{
    const r=by[n]||(by[n]=blankRow(n));
    r.bonus=r2(EX[n].bonus); r.reimb=r2(EX[n].reimb); r.deduct=r2(EX[n].deduct); r.items=EX[n].items;});
  return Object.values(by).map(r=>{
    r.comm=r2(r.comm);r.tip=r2(r.tip);r.tipCash=r2(r.tipCash);r.adj=r2(r.adj);r.hours=r2(r.hours);
    // Tips they already pocketed in cash on the job. Owed to them: nothing more.
    r.tipPay=r2(r.tip-r.tipCash);
    // GROSS is what goes on the QuickBooks pay run — cash-split tips are NOT in it,
    // because they were handed over on the driveway.
    r.gross=r2(r.comm+r.tipPay+r.adj+r.bonus-r.deduct);
    // TAKE-HOME adds the reimbursement back — paid, but never taxed.
    r.payout=r2(r.gross+r.reimb);
    // EARNED is everything they actually made, cash tips included. The wage floor
    // is tested against this, not against the pay run — a cash tip is still earnings.
    r.earned=r2(r.comm+r.tip+r.adj+r.bonus-r.deduct);
    r.rate=r.hours?r.earned/r.hours:NaN;
    r.under=r.hours>0&&r.rate<S.settings.rates.minWage;
    r.topup=r.under?r2(S.settings.rates.minWage*r.hours-r.earned):0;
    r.owner=isOwner(r.name);
    return r;}).sort((a,b)=>(a.owner===b.owner)?b.gross-a.gross:(a.owner?-1:1));
}

/* THE MONEY PLAN — cash first to owners, then what to move and why */
function plan(p){
  const t=totals(p), pr=payroll(p), rs=S.settings.reserve;
  const owners=pr.filter(r=>r.owner);
  const ownerPay=r2(owners.reduce((a,r)=>a+r.gross,0));
  const cashToOwners=r2(Math.min(t.cashIn, ownerPay));
  // split the available cash between owners in proportion to what each earned
  const share=owners.map(r=>({name:r.name, earned:r.gross,
    cash:ownerPay? r2(cashToOwners*(r.gross/ownerPay)) : 0}));
  share.forEach(s=>s.transfer=r2(s.earned-s.cash));
  const ownerTransfer=r2(Math.max(0, ownerPay-cashToOwners));
  const cashLeft=r2(Math.max(0, t.cashIn-cashToOwners));
  const taxBaseAmt = rs.taxBase==="transfer" ? ownerTransfer : ownerPay;
  const incomeTaxSave=r2(taxBaseAmt*rs.incomeTax);
  const ksSave=r2(t.ksSales*rs.ksSalesTax);
  const qbRun=r2(t.empWages);
  const qbCost=r2(t.empWages+t.empTax);
  const distr=Object.keys(S.settings.dist).map(k=>({k,pctv:S.settings.dist[k],amt:r2(t.net*S.settings.dist[k])}));
  return {t,pr,owners,ownerPay,cashToOwners,share,ownerTransfer,cashLeft,
    incomeTaxSave,ksSave,taxBaseAmt,qbRun,qbCost,distr,
    toSavings:r2(incomeTaxSave+ksSave)};
}

function prevCalc(){
  const price=num($("#jp").value), techs=[$("#j1").value,$("#j2").value,$("#j3").value].filter(Boolean), el=$("#prev");

  el.innerHTML=(solo?'<span class="pill solo">solo</span> ':"")+esc(parts.join("  ·  "))+"  ·  labor "+pct(tot);
}
function splitRows(txt){const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else{if(c==='"')q=true;else if(c==="\t"||c===","){row.push(cell);cell="";}
      else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}else if(c!=="\r")cell+=c;}}
  row.push(cell);rows.push(row);return rows.filter(r=>r.some(c=>String(c).trim()!==""));}
const nrm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const pad=n=>String(n).padStart(2,"0");
function parseDate(s){s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(m[1])+"-"+pad(m[2]);}
  const d=new Date(s); if(!isNaN(d)) return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  return null;}
let PENDING=null;
function parseImport(txt){
  const rows=splitRows(txt); if(rows.length<2) return {err:"Paste the header row plus at least one job."};
  const head=rows[0].map(nrm);
  // Exact header match first; then "starts with", so a Work Log header that
  // spells out its arithmetic — "JOB REVENUE (Package + Upcharge + Upsells)" —
  // still resolves when pasted straight from the sheet.
  const find=(...n)=>{for(const x of n){const i=head.indexOf(nrm(x));if(i>-1)return i;}
    for(const x of n){const t=nrm(x),i=head.findIndex(h=>h.indexOf(t)===0);if(i>-1)return i;}return -1;};
  const iDate=find("date"); if(iDate<0) return {err:"No Date column found — include the header row."};
  const iCust=find("client name","customer","client"), iSvc=find("package","service"),
    iRev=find("job revenue"), iPkg=find("package $","package price"), iUpch=find("condition upcharge","upcharge"),
    iUps=find("upsell total","upsell $"), iTicket=find("ticket total"), iTip=find("tip"),
    iPay=find("payment type","payment"), iT1=find("tech 1"), iT2=find("tech 2"), iT3=find("tech 3"),
    iTipCash=find("cash tip split?","cash tip split","tip split in cash","cash tip"),
    iDep=find("online deposit","deposit","stripe deposit","deposit paid"),
    iHrs=find("hours","hours duration"), iNotes=find("notes");
  const out=[],warn=[];
  if(iRev<0&&iPkg<0&&iTicket>-1) warn.push("No JOB REVENUE or Package $ column — using Ticket Total minus Tip.");
  if(iHrs<0) warn.push("No Hours column — hours will be blank and the wage floor can't be checked.");
  for(let r=1;r<rows.length;r++){
    const row=rows[r], raw=String(row[iDate]||"").trim(); if(!raw) continue;
    const date=parseDate(raw); if(!date){warn.push("Row "+(r+1)+": couldn't read date \""+raw+"\" — skipped.");continue;}
    const tip=iTip>-1?num(row[iTip]):0;
    let price;
    if(iRev>-1) price=num(row[iRev]);
    else if(iPkg>-1) price=num(row[iPkg])+(iUpch>-1?num(row[iUpch]):0)+(iUps>-1?num(row[iUps]):0);
    else if(iTicket>-1) price=num(row[iTicket])-tip; else price=0;
    out.push({id:uid(),date,customer:(iCust>-1?row[iCust]:"")||"—",service:(iSvc>-1?row[iSvc]:"")||"Other",
      price:r2(price),tip:r2(tip),
      /* Yes = the crew split that tip in cash on the job. Already paid, keep it out of the pay run. */
      tipCash:iTipCash>-1 && /^(y|true|1)/i.test(String(row[iTipCash]||"").trim()),
      /* The column may be a Yes/No or the amount itself. "Yes" means the standard
         online deposit; a number means that exact amount. */
      deposit:(function(){ if(iDep<0) return 0;
        const raw=String(row[iDep]||"").trim(); if(!raw) return 0;
        if(/^(y|true)/i.test(raw)) return num(S.settings.depositAmount)||50;
        if(/^n(o)?$/i.test(raw)) return 0;
        return r2(num(raw)); })(),
      payment:(iPay>-1?String(row[iPay]).trim():"")||"Other",status:"Completed",
      techs:[iT1>-1?row[iT1]:"",iT2>-1?row[iT2]:"",iT3>-1?row[iT3]:""].map(x=>String(x||"").trim()).filter(Boolean),
      adj:[0,0,0],hours:iHrs>-1?num(row[iHrs]):0,notes:(iNotes>-1?row[iNotes]:"")||""});
  }
  return {jobs:out,warn};
}
function previewImport(){
  const res=parseImport($("#paste").value), box=$("#importPreview");
  if(res.err){box.innerHTML=`<p class="hint" style="color:var(--neg)">${esc(res.err)}</p>`;return;}
  const known=new Set(S.settings.techs.map(t=>t.name));
  const seen=new Set(S.jobs.map(j=>j.date+"|"+String(j.customer).toLowerCase()+"|"+r2(num(j.price))));
  const methods=new Set(S.settings.methods);
  res.jobs.forEach(j=>{ j._dup=seen.has(j.date+"|"+String(j.customer).toLowerCase()+"|"+r2(num(j.price)));
    j._unknown=j.techs.filter(t=>!known.has(t)); j._badPay=j.payment&&!methods.has(j.payment);
    j._period=(periodOf(j.date)||{}).id||null; });
  PENDING=res.jobs;
  const dups=res.jobs.filter(j=>j._dup).length, unk=[...new Set(res.jobs.flatMap(j=>j._unknown))];
  const badPay=[...new Set(res.jobs.filter(j=>j._badPay).map(j=>j.payment))];
  const noP=res.jobs.filter(j=>!j._period).length;
  box.innerHTML=`<div class="bar" style="margin-top:.8rem">
      <span class="pill pos">${res.jobs.length} rows</span>
      ${dups?`<span class="pill warn">${dups} look like duplicates</span>`:""}
      ${unk.length?`<span class="pill neg">unknown tech: ${esc(unk.join(", "))}</span>`:""}
      ${badPay.length?`<span class="pill warn">unknown payment: ${esc(badPay.join(", "))}</span>`:""}
      ${noP?`<span class="pill neg">${noP} outside the calendar</span>`:""}</div>
    ${res.warn.length?`<p class="hint">${res.warn.map(esc).join("<br>")}</p>`:""}
    <div class="scroll" style="margin-top:.5rem;max-height:15rem;overflow-y:auto"><table>
      <thead><tr><th></th><th>Date</th><th>Customer</th><th class="n">Price</th><th class="n">Tip</th><th>Pay</th><th>Crew</th><th class="n">Hrs</th></tr></thead>
      <tbody>${res.jobs.map((j,i)=>`<tr><td><input type="checkbox" data-imp="${i}" ${j._dup?"":"checked"}></td>
        <td>${esc(fmtD(j.date))}</td><td>${esc(j.customer)}</td><td class="n">${money0(j.price)}</td>
        <td class="n">${j.tip?money0(j.tip):"—"}</td><td>${esc(j.payment)}</td>
        <td>${esc(j.techs.join(" + "))||"—"}${j._unknown.length?' <span class="pill neg">?</span>':""}</td>
        <td class="n">${j.hours||"—"}</td></tr>`).join("")}</tbody></table></div>
    <div class="bar"><button class="pri" id="confirmImport">Import ticked rows</button>
      <button class="ghost" id="cancelImport">Cancel</button></div>`;
  $("#confirmImport").addEventListener("click",()=>{
    const pick=$$("[data-imp]").filter(c=>c.checked).map(c=>PENDING[+c.dataset.imp]);
    if(!pick.length) return toast("Nothing ticked.");
    pick.forEach(j=>{delete j._dup;delete j._unknown;delete j._period;delete j._badPay;S.jobs.push(j);});
    const f=periodOf(pick[0].date); if(f) CUR=f.id;
    save(); fillPeriods(); renderAll(); toast("Imported "+pick.length+" job"+(pick.length===1?"":"s")+".");});
  $("#cancelImport").addEventListener("click",()=>{box.innerHTML="";$("#paste").value="";});
}

/* ---- SPEND (totals per section, no line items) ---- */

  $("#viewSub").textContent=p.short+" · totals only";

      ${kpi("Total spend",money0(tot),p.short)}
      ${kpi("% of revenue",pct(t.revenue?tot/t.revenue:NaN))}
      ${kpi("Biggest section",(()=>{const b=cats.slice().sort((a,b2)=>num(cur[b2])-num(cur[a]))[0];return b&&num(cur[b])?esc(b):"—";})(),
        (()=>{const b=cats.slice().sort((a,b2)=>num(cur[b2])-num(cur[a]))[0];return b&&num(cur[b])?money0(num(cur[b])):"";})())}
      ${kpi("Net income",money0(t.net),pct(t.netPct)+" margin",t.net<0?"neg":"pos")}
    </div>
    <div class="card">
      <h2>Where every dollar went</h2>

        bottom number is what the business actually kept.</p>
      <div class="scroll"><table>
        <tbody>
          <tr><td>Collected from customers <span class="hint">what people actually handed over</span></td>
              <td class="n">${money(r2(t.revenue+t.tips))}</td><td class="n hint">—</td></tr>

          <tr><td>— Employee commission${t.x.empBonus?" + bonuses":""}${t.x.empDeduct?" − deductions":""}
              <span class="hint">the W-2 crew, tips excluded</span></td>
              <td class="n">${money(-r2(t.empCost-t.empTax))}</td>
              <td class="n">${t.revenue?pct((t.empCost-t.empTax)/t.revenue):"—"}</td></tr>
          <tr><td>— Employer payroll tax <span class="hint">${pct(S.settings.rates.tax)} of gross wages, charged on tips too</span></td>
              <td class="n">${money(-t.empTax)}</td>
              <td class="n">${t.revenue?pct(t.empTax/t.revenue):"—"}</td></tr>
          <tr style="border-bottom:1px solid var(--line2)"><td><b>Total labor</b></td>
              <td class="n"><b>${money(-t.labor)}</b></td>
              <td class="n" style="color:${t.laborPct>0.55?"var(--neg)":t.laborPct>0.5?"var(--warn)":"var(--pos)"}">
                <b>${pct(t.laborPct)}</b></td></tr>

          ${t.reimb?`<tr><td>— Reimbursed to the crew <span class="hint">their own money back, not wages</span></td>
              <td class="n">${money(-t.reimb)}</td>

    <div class="card">
      <h2>What you spent, by section</h2>
      <p class="sub">One number per section for this pay period — the same shape as the old sheet. Your real transactions live in Chase and QuickBooks; this is just the totals so net income is right.</p>

        ${cats.map(c=>`<span class="pill mut" style="cursor:pointer" data-rmcat="${esc(c)}" title="remove">${esc(c)} ×</span>`).join(" ")}</div></div>`;
  $$("[data-sp]").forEach(i=>i.addEventListener("change",()=>{
    const m=S.spend[CUR]||(S.spend[CUR]={}); const v=i.value.trim();
    if(v==="") delete m[i.dataset.sp]; else m[i.dataset.sp]=num(v);
    save(); renderSpend();}));
  $("#addCat").addEventListener("click",()=>{const v=$("#newCat").value.trim();
    if(v&&S.settings.spendCats.indexOf(v)<0){S.settings.spendCats.push(v);save();renderSpend();}});
  $$("[data-rmcat]").forEach(el=>arm(el,()=>{
    const c=el.dataset.rmcat;
    S.settings.spendCats=S.settings.spendCats.filter(x=>x!==c);save();renderSpend();
    toast("Removed \""+c+"\". Anything already entered under it is kept in the data.");}));
  $("#copyPrev").addEventListener("click",()=>{
    const i=PERIODS.findIndex(x=>x.id===CUR); if(i<1) return toast("No earlier period.");
    const prev=S.spend[PERIODS[i-1].id];
    if(!prev||!Object.keys(prev).length) return toast("Nothing in the previous period.");
    S.spend[CUR]=Object.assign({},prev); save(); renderSpend(); toast("Copied from "+PERIODS[i-1].id+" — now adjust it.");});
}

/* ---- YEAR ---- */
function renderYear(){
  $("#viewSub").textContent="2026 · year to date";
  /* A period is shown from LIVE data once anything is logged into it. Until then
     it falls back to what the original workbook actually recorded, so the year
     is complete from January rather than starting the day the app did. */
  const rows=PERIODS.map(p=>{const t=totals(p.id),P=plan(p.id),h=HISTORY[p.id];
    const live=t.jobs>0||t.opex>0;
    /* The old book's "Total Expenses" bundles payroll, payroll tax and owner pay
       in with everything else. The ledger keeps labor and spend apart, so strip
       the labor back out — otherwise labor gets counted twice in the year strip. */
    const hLab=h?r2(((h.exp&&h.exp["Payroll"])||0)+((h.exp&&h.exp["Payroll tax"])||0)+((h.exp&&h.exp["Owner work pay"])||0)):0;
    return {p,...t,ownerPay:P.ownerPay,toSavings:P.toSavings,h,live,
      xRev:live?t.revenue:(h?h.gross:0),
      xOpex:live?t.opex:(h?r2(Math.max(0,h.totalExp-hLab)):0),
      xNet:live?t.net:(h?h.net:0),
      xKs:live?t.ksSales:(h?h.ks:0),
      xJobs:live?t.jobs:(h?h.jobCount:0),
      xOwn:live?P.ownerPay:(h?r2((h.exp&&h.exp["Owner work pay"])||0):0),
      xLab:live?t.labor:hLab};})
    .filter(r=>r.live||r.h);
  const y=rows.reduce((a,r)=>({rev:a.rev+r.xRev,lab:a.lab+r.xLab,op:a.op+r.xOpex,net:a.net+r.xNet,
    tips:a.tips+r.tips,hrs:a.hrs+r.hours,jobs:a.jobs+r.xJobs,cash:a.cash+r.cashIn,ks:a.ks+r.xKs,
    sav:a.sav+r.toSavings,own:a.own+r.xOwn}),
    {rev:0,lab:0,op:0,net:0,tips:0,hrs:0,jobs:0,cash:0,ks:0,sav:0,own:0});
  Object.keys(y).forEach(k=>y[k]=r2(y[k]));
  /* The two sources do not measure the same thing: old-book revenue includes
     tips (and Kansas sales tax), ledger revenue excludes them. Never present the
     blend as if it were one clean figure — split it and say so. */
  const liveRows=rows.filter(r=>r.live), oldRows=rows.filter(r=>!r.live);
  const sub=rs=>rs.reduce((a,r)=>({rev:r2(a.rev+r.xRev),net:r2(a.net+r.xNet),
    op:r2(a.op+r.xOpex),jobs:a.jobs+r.xJobs}),{rev:0,net:0,op:0,jobs:0});
  const sLive=sub(liveRows), sOld=sub(oldRows), mixed=liveRows.length&&oldRows.length;
  $("#v-year").innerHTML=`
    <div class="hero"><span class="lbl">Year to date · net income</span>
      <div class="big ${y.net<0?"neg":"pos"}">${money0(y.net)}</div>
      <div class="strip"><span>revenue <b>${money0(y.rev)}</b></span>
        <span>labor <b>${money0(y.lab)}</b> (${pct(y.rev?y.lab/y.rev:NaN)})</span>
        <span>spend <b>${money0(y.op)}</b></span><span>margin <b>${pct(y.rev?y.net/y.rev:NaN)}</b></span>
        <span><b>${y.jobs}</b> jobs</span></div></div>
    ${mixed?`<div class="card" style="border-left:3px solid var(--warn)">
      <h2>This year total mixes two different measures</h2>
      <p class="sub" style="margin-bottom:.6rem">Read the two halves separately — do not treat the
        combined figure as one clean number.</p>
      <div class="scroll"><table>
        <thead><tr><th>Basis</th><th class="n">Periods</th><th class="n">Jobs</th><th class="n">Revenue</th><th class="n">Net</th><th>What revenue means here</th></tr></thead>
        <tbody>
          <tr><td><span class="pill pos">ledger</span></td><td class="n">${liveRows.length}</td>
            <td class="n">${sLive.jobs}</td><td class="n">${money0(sLive.rev)}</td><td class="n">${money0(sLive.net)}</td>
            <td class="hint">Job revenue only. Tips excluded — they are the crew's, not yours.</td></tr>
          <tr><td><span class="pill mut">old book</span></td><td class="n">${oldRows.length}</td>
            <td class="n">${sOld.jobs}</td><td class="n">${money0(sOld.rev)}</td><td class="n">${money0(sOld.net)}</td>
            <td class="hint">Gross <b>including</b> tips, and sales tax on Kansas jobs.</td></tr>
        </tbody></table></div>
      <p class="hint" style="margin-top:.6rem">Old-book rows run roughly 6–7% high against ledger rows.
        Importing a period into the ledger will therefore make the year revenue <b>drop</b> — nothing has
        been lost, the number just got more honest. When all 14 periods are on the ledger basis this
        panel disappears and the year total means one thing again.</p></div>`:""}
    <div class="kpis">
      ${kpi("Owner work pay",money0(y.own),"Habib + Ryan, YTD")}
      ${kpi("Cash collected",money0(y.cash),"YTD","cash")}
      ${kpi("Kansas sales",money0(y.ks),"YTD")}
      ${kpi("Set aside to savings",money0(y.sav),"income + KS sales tax","pos")}
      ${kpi("Hours logged",r2(y.hrs)||"—","across the crew")}
    </div>
    <div class="card"><h2>Net income by pay period</h2>
      <p class="sub">Above the line made money. Hover for the breakdown.</p>
      <div class="chartwrap"><svg class="chart" id="netChart" role="img" aria-label="Net income by pay period"></svg></div>
      <div class="bar"><span class="hint"><span class="pill pos">profit</span> <span class="pill neg">loss</span></span></div></div>
    <div class="card"><h2>Every period</h2>
      <div class="scroll"><table>
        <thead><tr><th>Period</th><th>Source</th><th class="n">Jobs</th><th class="n">Revenue</th><th class="n">Cash</th><th class="n">KS sales</th>
          <th class="n">Owner pay</th><th class="n">Labor</th><th class="n">Labor %</th><th class="n">Spend</th>
          <th class="n">Net</th><th class="n">Margin</th><th class="n">Savings</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${esc(r.p.id)} <span class="hint">${esc(r.p.short)}</span></td>
          <td>${r.live?'<span class="pill pos">ledger</span>':`<span class="pill mut" title="${esc(r.h.tab)}">old book</span>`}</td>
          <td class="n">${r.xJobs||"—"}</td><td class="n">${r.xRev?money0(r.xRev):"—"}</td>
          <td class="n">${r.cashIn?money0(r.cashIn):"—"}</td><td class="n">${r.xKs?money0(r.xKs):"—"}</td>
          <td class="n">${r.xOwn?money0(r.xOwn):"—"}</td><td class="n">${r.xLab?money0(r.xLab):"—"}</td>
          <td class="n">${r.xRev?pct(r.xLab/r.xRev):"—"}</td><td class="n">${r.xOpex?money0(r.xOpex):"—"}</td>
          <td class="n" style="color:${r.xRev?(r.xNet<0?"var(--neg)":"var(--pos)"):"inherit"}">${r.xRev?money0(r.xNet):"—"}</td>
          <td class="n">${r.xRev?pct(r.xNet/r.xRev):"—"}</td><td class="n">${r.toSavings?money0(r.toSavings):"—"}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>2026 total</td><td></td><td class="n">${y.jobs}</td><td class="n">${money0(y.rev)}</td>
          <td class="n">${money0(y.cash)}</td><td class="n">${money0(y.ks)}</td><td class="n">${money0(y.own)}</td>
          <td class="n">${money0(y.lab)}</td><td class="n">${pct(y.rev?y.lab/y.rev:NaN)}</td><td class="n">${money0(y.op)}</td>
          <td class="n">${money0(y.net)}</td><td class="n">${pct(y.rev?y.net/y.rev:NaN)}</td>
          <td class="n">${money0(y.sav)}</td></tr></tfoot>
      </table></div>
      <p class="hint" style="margin-top:.6rem"><b>old book</b> rows were read straight out of your original
        "Matrix Finances" workbook on 24 Aug 2026 — real figures, not estimates. A period flips to
        <b>ledger</b> the moment you log a job or a spend total into it, and then it is computed live.
        Revenue in the old-book rows is gross <i>including</i> tips, because that is how the original
        sheet counted it; ledger rows exclude tips. That is the one place the two are not comparing
        like with like.</p></div>`;
  drawNet(rows.filter(r=>r.xRev>0||r.xOpex>0).map(r=>({...r,revenue:r.xRev,net:r.xNet,opex:r.xOpex})));
}
const tipEl=$("#tip");
function showTip(h,e){tipEl.innerHTML=h;tipEl.style.opacity="1";const r=tipEl.getBoundingClientRect();
  tipEl.style.left=Math.min(innerWidth-r.width-8,Math.max(8,e.clientX+12))+"px";
  tipEl.style.top=Math.max(8,e.clientY-r.height-12)+"px";}
const hideTip=()=>tipEl.style.opacity="0";
function drawNet(data){
  const svg=$("#netChart"); if(!svg) return;
  if(!data.length){svg.setAttribute("viewBox","0 0 520 70");svg.innerHTML='<text x="12" y="34" class="axis">Nothing logged yet.</text>';return;}
  const W=Math.max(520,data.length*56),H=250,m={t:14,r:14,b:36,l:64};
  const vals=data.map(d=>d.net),lo=Math.min(0,...vals),hi=Math.max(0,...vals),span=(hi-lo)||1;
  const iw=W-m.l-m.r,ih=H-m.t-m.b,bw=Math.min(32,iw/data.length*.6),y=v=>m.t+ih-((v-lo)/span)*ih;
  let g='<g class="grid">',ax='<g class="axis">';
  for(let i=0;i<=4;i++){const v=lo+span*i/4;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    ax+=`<text x="${m.l-8}" y="${y(v)+3}" text-anchor="end">${money0(v)}</text>`;}
  g+="</g>"+ax+"</g>"+`<line class="zero" x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  data.forEach((d,i)=>{const cx=m.l+iw/data.length*(i+.5),top=Math.min(y(d.net),y(0)),h=Math.abs(y(d.net)-y(0));
    g+=`<rect rx="3" x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(2,h)}" fill="${d.net<0?"var(--neg)":"var(--pos)"}" data-i="${i}"/>`;
    g+=`<g class="axis"><text x="${cx}" y="${H-14}" text-anchor="middle">${d.p.id.replace("PP","")}</text></g>`;});
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML=g;
  svg.querySelectorAll("rect[data-i]").forEach(rc=>{const d=data[+rc.dataset.i];
    rc.addEventListener("mousemove",e=>showTip(`<b>${esc(d.p.id)}</b> ${esc(d.p.short)}<br>Revenue <b>${money0(d.revenue)}</b><br>
      Labor <b>${money0(d.labor)}</b> (${pct(d.laborPct)})<br>Spend <b>${money0(d.opex)}</b><br>Net <b>${money0(d.net)}</b>`,e));
    rc.addEventListener("mouseleave",hideTip);});
}

async function offer(filename,data){
  let dl=null; try{dl=window.claude&&claude.use?await claude.use("downloads"):null;}catch(e){}
  if(dl){
    try{await dl.save({filename,data});toast("Saved "+filename);}
    catch(e){toast(e&&e.code==="declined"?"Cancelled.":"Couldn't save that file.");}
    return;
  }
  /* Off the artifact sandbox an anchor download just works and asks nobody. */
  try{
    const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("Saved "+filename);
  }catch(e){ toast("Couldn't save that file."); }
}
